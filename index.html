<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Play by Ear">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141B" media="(prefers-color-scheme: dark)">
<meta name="description" content="Daily piano practice by ear: songs in levels, chord shapes with finger numbers, ear drills and a 30-minute timer.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<style>
html{color-scheme:light;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<title>Play by Ear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one column. Practice timer on top, then two tabs (Learn, Ear drills). Learn shows levels and songs, or one song with chord strip, keyboard and controls. */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface-2:#E9EDF3; --ink:#15202B; --muted:#586575; --line:#D5DBE4;
  --rh:#2A62D9; --rh-tint:#CFE0FF; --lh:#B96A00; --lh-tint:#FFE0B0; --on-hand:#FFFFFF;
  --good:#17805A; --good-tint:#D6F1E5; --bad:#B3322A; --bad-tint:#F8DAD7; --warn:#9A5B00;
  --key-white:#FCFDFF; --key-black:#1B2431; --key-line:#8B97A8; --key-text:#586575;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141B; --surface:#171F29; --surface-2:#212B37; --ink:#E7ECF2; --muted:#9AA7B6; --line:#2B3746;
    --rh:#7BA9FF; --rh-tint:#23406F; --lh:#F3AE45; --lh-tint:#5A3C0E; --on-hand:#0E1319;
    --good:#4FC58F; --good-tint:#15392B; --bad:#FF8A80; --bad-tint:#4A2320; --warn:#F3AE45;
    --key-white:#E6EBF1; --key-black:#0B1017; --key-line:#5B6878; --key-text:#3D4856;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#171F29; --surface-2:#212B37; --ink:#E7ECF2; --muted:#9AA7B6; --line:#2B3746;
  --rh:#7BA9FF; --rh-tint:#23406F; --lh:#F3AE45; --lh-tint:#5A3C0E; --on-hand:#0E1319;
  --good:#4FC58F; --good-tint:#15392B; --bad:#FF8A80; --bad-tint:#4A2320; --warn:#F3AE45;
  --key-white:#E6EBF1; --key-black:#0B1017; --key-line:#5B6878; --key-text:#3D4856;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
*{box-sizing:border-box}
.app{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
button,.opt,.chip,.bar{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
textarea{width:100%;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
details.card summary{font-weight:600}
.app>*,#view>*,.card>*{min-width:0;max-width:100%}
#view{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{min-width:0}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:22px;font-weight:800}
h3{font-size:16px;font-weight:600}
p{margin:0}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rh);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hint{color:var(--muted);font-size:14px}
.btn{background:var(--rh);color:var(--on-hand);border:0;border-radius:10px;padding:10px 18px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;min-height:36px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{background:var(--surface-2);border:1px solid transparent;border-radius:999px;padding:7px 14px;font-weight:500;min-height:38px}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.streak{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.dots{display:flex;gap:5px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.dot.on{background:var(--good);border-color:var(--good)}
.dot.today{outline:2px solid var(--ink);outline-offset:1px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav .chip{flex:1 1 0;min-width:120px;text-align:center;font-weight:600}
/* timer */
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tnum{font-family:var(--font-display);font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.tgoal{color:var(--muted);font-variant-numeric:tabular-nums}
.tbar{display:grid;grid-template-columns:5fr 15fr 10fr;gap:4px;margin-top:12px}
.seg{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.seg i{display:block;height:100%;background:var(--good);width:0}
.tlabels{display:grid;grid-template-columns:5fr 15fr 10fr;gap:4px;font-size:12px;color:var(--muted);margin-top:4px}
.tlabels span.now{color:var(--ink);font-weight:600}
/* home */
.levels{display:flex;gap:8px;overflow-x:auto;padding-block:8px;margin-block:4px}
.levels .chip{white-space:nowrap}
.songs{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.song{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.song:hover{border-color:var(--rh)}
.song .t{font-weight:600;font-size:16px}
.song .m{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--surface-2);white-space:nowrap}
.pill.good{background:var(--good-tint);color:var(--good)}
.pill.next{background:var(--rh-tint);color:var(--ink)}
.prog{display:flex;gap:4px;margin-top:6px}
.prog i{width:18px;height:6px;border-radius:3px;background:var(--surface-2)}
.prog i.on{background:var(--good)}
.next-card{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-color:var(--rh)}
.rev{display:grid;gap:8px}
.rev .song{padding:10px 14px}
/* song */
.meta{display:flex;gap:8px;flex-wrap:wrap}
.stages{display:flex;gap:8px;flex-wrap:wrap}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.bar{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;min-height:68px}
.bar b{display:block;font-family:var(--font-display);font-size:21px;font-weight:800;line-height:1.1}
.bar small{display:block;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bar[aria-pressed="true"]{border-color:var(--rh);background:var(--rh-tint)}
.kbscroll{overflow-x:auto;border-radius:10px;max-width:100%}
.kb{display:block;width:100%;min-width:540px;height:auto}
.kb .wk{fill:var(--key-white);stroke:var(--key-line);stroke-width:1}
.kb .bk{fill:var(--key-black);stroke:var(--key-black)}
.kb .wk.rh{fill:var(--rh-tint)} .kb .wk.lh{fill:var(--lh-tint)}
.kb .bk.rh{fill:var(--rh)} .kb .bk.lh{fill:var(--lh)}
.kb .nm{font-size:13px;fill:var(--key-text);text-anchor:middle;font-family:var(--font-body);pointer-events:none}
.kb .nm.c{font-weight:700}
.kb .badge.rh{fill:var(--rh)} .kb .badge.lh{fill:var(--lh)}
.kb .fn{font-size:15px;font-weight:700;fill:var(--on-hand);text-anchor:middle;dominant-baseline:central;pointer-events:none;font-family:var(--font-body)}
.kb .mid{fill:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.conceal{display:flex;align-items:center;justify-content:center;min-height:120px;text-align:center;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:16px}
.explain{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.explain .big{font-family:var(--font-display);font-size:26px;font-weight:800}
.notes{display:flex;gap:8px;flex-wrap:wrap}
.note{background:var(--surface-2);border-radius:8px;padding:4px 10px;font-weight:600;font-variant-numeric:tabular-nums}
dl.fing{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0}
dl.fing dt{color:var(--muted)} dl.fing dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.12)}
.sbar.on{display:flex}.sbar .btn{min-width:160px}
.controls{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.play{font-size:17px;min-width:120px}
.field{display:flex;flex-direction:column;gap:4px}
select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;max-width:100%}
details summary{cursor:pointer;font-weight:600}
details .row{margin-top:12px}
ol.steps{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
.back{align-self:flex-start}
.locked{text-align:center;display:grid;gap:10px;justify-items:center;padding:24px}
.tag{font-size:12px;color:var(--muted)}
.clean{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.feelbox{background:var(--surface-2);border-radius:10px;padding:12px}
a{color:var(--rh)}
/* drills */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opts.tight{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.opt{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 10px;font-weight:600;min-height:48px;text-align:center}
.opt:hover:not([disabled]){border-color:var(--rh)}
.opt[aria-pressed="true"]{border-color:var(--rh);background:var(--rh-tint)}
.opt.ok{background:var(--good-tint);border-color:var(--good);color:var(--ink)}
.opt.no{background:var(--bad-tint);border-color:var(--bad);color:var(--ink)}
.fb{border-radius:10px;padding:12px;display:grid;gap:6px}
.fb.ok{background:var(--good-tint)} .fb.no{background:var(--bad-tint)}
.fb b{font-family:var(--font-display);font-size:18px}
.qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.qbar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--rh)}
.dmodes{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.dmode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.dmode[aria-pressed="true"]{border-color:var(--rh);background:var(--rh-tint)}
.dmode b{font-family:var(--font-display);font-size:17px}
.dmode span{font-size:13px;color:var(--muted)}
.barpick{display:grid;gap:6px}
.big-score{font-family:var(--font-display);font-size:40px;font-weight:800}
@media (prefers-reduced-motion:no-preference){.bar,.song,.opt{transition:border-color .15s,background .15s}}
.ss-head{gap:12px}
.ss-segs{display:flex;gap:6px}
.ss-seg{display:block;height:8px;border-radius:99px;background:var(--surface-2)}
.ss-seg.done{background:var(--good)}.ss-seg.now{background:var(--rh)}.ss-seg.skip{background:repeating-linear-gradient(45deg,var(--line) 0 4px,transparent 4px 8px)}
.ss-hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ss-hrow h2{margin:2px 0 0}
.ss-timer{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.ss-timer small{font-family:var(--font-body);font-size:14px;font-weight:500;color:var(--muted)}
.ss-timer.dim{opacity:.45}
.ss-total{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}.ss-total b{color:var(--ink);font-size:20px}
.ss-tup{margin:0;padding:8px 12px;background:var(--surface-2);border-radius:10px;font-weight:600}
.nrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}.nchip{display:flex;flex-direction:column;align-items:center;gap:4px}.nchip .note{font-size:22px;padding:8px 16px}.nchip small{color:var(--muted,#667);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.ss-plan li{display:block;padding:0}.ss-plan .ss-li>span:last-child{display:block;min-width:0}.ss-plan .ss-li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;justify-content:stretch;text-align:left;background:none;border:0;padding:6px;border-radius:12px;font:inherit;color:inherit;width:100%;cursor:pointer}.ss-plan .ss-li:hover{background:var(--surface-2)}.ss-btns{display:flex;gap:10px;flex-wrap:wrap}.ss-btns .btn{flex:1 1 220px}
.ss-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ss-next{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ss-next .btn{min-width:220px}
.ss-paused{background:var(--lh-tint);border:1px solid var(--lh);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
.ss-titlebar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.ss-titlebar h2{margin:2px 0 0}
.ss-big{font-size:18px;line-height:1.55;margin:0;max-width:62ch}
.ss-plan{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ss-plan li{display:block}
.ss-plan .m{background:var(--rh-tint);color:var(--ink);font-weight:800;border-radius:10px;text-align:center;padding:8px 0}
.ss-plan b{display:block}
.ss-row{display:flex;flex-direction:row;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.note.empty{border:2px dashed var(--line);color:var(--muted)}
.btn.big{width:100%;font-size:20px;padding:16px 22px}
.btn[aria-pressed="true"]{outline:2px solid var(--rh);outline-offset:1px}
@media (max-width:640px){.ss-timer{font-size:34px}.ss-next{align-items:stretch;width:100%}.ss-next .btn{width:100%}}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div>
      <h1>Play by Ear</h1>
      <p class="sub">One song at a time. Thirty minutes a day.</p>
    </div>
    <div class="streak" id="streak" aria-live="polite"></div>
  </header>
  <section class="card" id="timer" aria-label="Daily practice timer"></section>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main id="view"></main>
</div>

<script>
/*THEORY*/
const SHARP=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const FLAT=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const NOTE_PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const LET=['C','D','E','F','G','A','B'];
const Q={'':[0,4,7],'m':[0,3,7],'7':[0,4,7,10],'maj7':[0,4,7,11],'m7':[0,3,7,10],'sus4':[0,5,7],'add9':[0,4,7,2],'6':[0,4,7,9],'dim':[0,3,6]};
const STEPS={0:0,2:1,3:2,4:2,5:3,6:4,7:4,9:5,10:6,11:6};
const ROM_MAJ=['I','♭II','II','♭III','III','IV','♭V','V','♭VI','VI','♭VII','VII'];
const ROM_MIN=['I','♭II','II','III','♯III','IV','♭V','V','VI','♯VI','VII','♯VII'];
const DEG=['1','♭2','2','♭3','3','4','♭5','5','♭6','6','♭7','7'];
const mod12=n=>((n%12)+12)%12;
const minorish=q=>q==='m'||q==='m7'||q==='dim';
function notePc(s){const m=/^([A-G])([#b♯♭]?)$/.exec(s);if(!m)throw new Error('bad note '+s);const a=m[2];return mod12(NOTE_PC[m[1]]+((a==='#'||a==='♯')?1:(a==='b'||a==='♭')?-1:0));}
function parseChord(s){const parts=String(s).split('/');const m=/^([A-G][#b]?)(.*)$/.exec(parts[0]);if(!m)throw new Error('bad chord '+s);const q=m[2];if(!Object.prototype.hasOwnProperty.call(Q,q))throw new Error('bad quality '+s);const root=notePc(m[1]);return{root,q,bass:parts[1]?notePc(parts[1]):root,slash:!!parts[1]};}
function keyInfo(key){const minor=/m$/.test(key);return{tonic:notePc(key.replace(/m$/,'')),minor};}
function keyUsesFlats(tonic,minor){return(minor?[2,7,0,5,10,3]:[5,10,3,8,1,6]).includes(mod12(tonic));}
function keyName(key,shift){const k=keyInfo(key);const t=mod12(k.tonic+shift);return(keyUsesFlats(t,k.minor)?FLAT:SHARP)[t]+(k.minor?' minor':' major');}
function spellChord(rootName,q,rootPc){const li=LET.indexOf(rootName[0]);return Q[q].map(iv=>{const L=LET[(li+STEPS[iv])%7];const pc=mod12(rootPc+iv);const d=((pc-NOTE_PC[L]+18)%12)-6;return{pc,name:L+(d===0?'':d===1?'♯':d===-1?'♭':d>0?'♯♯':'♭♭')};});}
function romanFor(chordStr,tonic,minor){const c=parseChord(chordStr);let base=(minor?ROM_MIN:ROM_MAJ)[mod12(c.root-tonic)];if(minorish(c.q))base=base.replace(/[IV]+/,m=>m.toLowerCase());const suf={'':'','m':'','7':'7','maj7':'maj7','m7':'7','sus4':'sus4','add9':'add9','6':'6','dim':'°'}[c.q];return base+suf+(c.slash?'/'+DEG[mod12(c.bass-tonic)]:'');}
function fingersFor(notes){const n=notes.length;if(n===3){return(notes[2]-notes[1]>=5)?[1,2,5]:[1,3,5];}if(n===4)return[1,2,3,5];return notes.map((_,i)=>i+1);}
function voice(root,q,smooth,prevMean){
  const pcs=Q[q].map(i=>mod12(root+i));const invs=smooth?pcs.map((_,k)=>k):[0];
  const build=(limit)=>{const out=[];for(const k of invs){const order=pcs.slice(k).concat(pcs.slice(0,k));for(let low=60;low<=71;low++){if(mod12(low)!==order[0])continue;const notes=[low];for(let i=1;i<order.length;i++){let n=notes[i-1]+1;while(mod12(n)!==order[i])n++;notes.push(n);}if(notes[notes.length-1]<=limit&&notes[notes.length-1]-notes[0]<=14)out.push({notes,k});}}return out;};
  let c=build(79);if(!c.length)c=build(84);if(!c.length)c=[{notes:pcs.map((p,i)=>60+mod12(p-60)+(i?12:0)).sort((a,b)=>a-b),k:0}];
  if(!smooth||prevMean==null)return c.find(x=>x.k===0)||c[0];
  const target=prevMean;
  return c.reduce((best,x)=>{const m=x.notes.reduce((s,n)=>s+n,0)/x.notes.length;const d=Math.abs(m-target);return(!best||d<best.d)?{...x,d,m}:best;},null);
}
function flattenBars(song){const out=[];song.sections.forEach(sec=>sec.bars.forEach((b,i)=>out.push({chord:b,shift:sec.shift||0,section:sec.name,first:i===0})));return out;}

  let vis="",btns="";
  if(T0.cmp){const mn=BS.mm==="min";vis='<div class="kbscroll">'+kbSvg(mn?[60,63,67]:CMAJ,null,mn?["C","E♭","G"]:["C","E","G"],{names:true})+'</div>';
    btns='<div class="row"><button class="btn ghost" data-act="bmm" data-v="maj" aria-pressed="'+(!mn)+'">Hear C major</button><button class="btn ghost" data-act="bmm" data-v="min" aria-pressed="'+mn+'">Hear C minor</button></div>';}
  else if(T0.loop){vis='<div class="strip"><div class="bar" style="cursor:default"><b>C</b><small>I · home</small></div><div class="bar" style="cursor:default"><b>F</b><small>IV</small></div><div class="bar" style="cursor:default"><b>G</b><small>V</small></div><div class="bar" style="cursor:default"><b>C</b><small>I · home</small></div></div>';}
  else{vis='<div class="kbscroll">'+kbSvg(T0.rh,T0.lh!=null?T0.lh:null,T0.f,{names:true})+'</div>'+(T0.lh!=null?'<div class="legend"><span><i style="background:var(--rh)"></i>Right hand</span><span><i style="background:var(--lh)"></i>Left hand</span></div>':'');}
  if(!T0.cmp)btns='<div class="row">'+T0.hear.map((h,i)=>'<button class="btn ghost" data-act="bhear" data-i="'+i+'">'+esc(h[0])+'</button>').join("")+'</div>';
  return top+'<div class="ss-titlebar"><div><span class="label">Basics · '+(n+1)+' of '+BASICS.length+'</span><h2>'+esc(T0.t)+'</h2></div><div class="row" role="group" aria-label="Lessons">'+chips+'</div></div>'+
   '<div class="card stack"><p class="ss-big">'+esc(T0.x)+'</p>'+vis+'<p class="hint">'+esc(T0.cap)+'</p>'+btns+'<p class="hint" role="status">'+esc(BS.heard)+'</p></div>'+
   '<div class="ss-foot"><button class="btn ghost" data-act="bprev"'+(n===0?' style="visibility:hidden"':'')+'>Previous</button><button class="btn" data-act="'+(last?'bclose':'bnext')+'">'+(last?(inSess?"Back to practice":"Finish basics"):"Next")+'</button></div>';
}
function welcomeView(){
  return '<div class="stack" style="padding-top:8px"><h2>Welcome to Play by Ear</h2><p class="ss-big">You do not need to know any music to start. First, take about 8 minutes to learn seven basic ideas: the keyboard, half steps, what a chord is, how major and minor sound, chord numbers, finger numbers, and how a song moves.</p></div>'+
   '<div class="card stack"><span class="label">The basics · 7 short lessons · about 8 minutes</span><ol class="steps">'+BASICS.map(b=>'<li>'+esc(b.t)+'</li>').join("")+'</ol>'+
   '<button class="btn big" data-act="bstart">Start the basics</button><button class="btn ghost" data-act="bskip">Skip for now</button></div>'+
   '<p class="hint">You can come back to the basics at any time, from the start screen or during a practice step.</p>';
}

/* start and done */
function startView(){
  const sv=sessSaved();const dn=P.sess&&P.sess.day===todayKey()&&P.sess.done;
  const p=sv?{song:sv.song,revSong:sv.revSong,drill:sv.drill,chords:sv.chords}:makePlan();
  const song=byId(p.song)||library()[0],rv=p.revSong?byId(p.revSong):null;
  const items=[[5,"Ear warm-up",dmeta(p.drill).name],[5,"Build the chords",p.chords.join(", ")],[10,"Today's song",song.title+" · Stage "+stageFor(song)],[10,"Review and ear-to-hands",(rv?rv.title+" from memory":"Today's song from memory")+", then find a loop by ear"]];
  const label=sv?"Resume practice (step "+(sv.step+1)+" of 4)":dn?"Practise again":"Start today's practice";
  return '<div class="card stack"><span class="label">Today · 30 minutes'+(dn?" · done":"")+'</span>'+
   '<p class="hint">Tap any step to jump straight to it.</p><ul class="ss-plan">'+items.map((x,k)=>{const stt=sv?(sv.step===k?" · you are here":sv.status[k]==="done"?" · done":sv.status[k]==="skip"?" · skipped":""):"";return '<li><button class="ss-li" data-act="sstart" data-step="'+k+'"><span class="m">'+x[0]+'</span><span><b>'+esc(x[1])+'</b><span class="hint">'+esc(x[2])+esc(stt)+'</span></span></button></li>';}).join("")+'</ul>'+
   '<div class="ss-btns"><button class="btn big" data-act="sstart">'+label+'</button>'+(sv?'<button class="btn ghost big" data-act="sstart" data-fresh="1">Start from the beginning</button>':'')+'</div></div>'+
   '<div class="card ss-row"><div><b>The basics</b><div class="hint">What a chord is, how major and minor sound, and more. 7 short lessons.</div></div><button class="btn ghost" data-act="bstart">Open basics</button></div>'+
   '<div class="row" style="justify-content:center"><button class="btn ghost small" data-act="browse">Browse songs and levels</button><button class="btn ghost small" data-act="browsebk">Backup</button></div>';
}
function doneView(){
  const st=S.status;
  return '<div class="stack" style="text-align:center;align-items:center;padding-top:12px"><h2>Practice done</h2><p class="hint">Your streak is at the top of the page. Come back tomorrow for the next steps.</p></div>'+
   '<div class="card stack"><span class="label">Today\'s steps</span><ul class="ss-plan">'+SESS.map((x,i)=>'<li><span class="m">'+(x.len/60)+'</span><span><b>'+esc(x.name)+'</b><span class="hint">'+(st[i]==="skip"?"Skipped":st[i]==="done"?"Done":"Not done")+'</span></span></li>').join("")+'</ul>'+
   '<button class="btn big" data-act="tostart">Back to start</button></div>';
}

/* session screens */
function sessHeader(){
  const i=S.step,st=SESS[i];
  const segs=SESS.map((x,j)=>'<i class="ss-seg '+(S.status[j]==="done"?"done":S.status[j]==="skip"?"skip":j===i?"now":"")+'" style="flex:'+x.len+'"></i>').join("");
  return '<div class="card stack ss-head"><div class="ss-segs" aria-hidden="true">'+segs+'</div>'+'<div class="row" role="group" aria-label="Jump to a step">'+SESS.map((x,j)=>'<button class="chip" data-act="sgo" data-step="'+j+'" aria-pressed="'+(j===i)+'">'+(S.status[j]==="done"?"✓ ":"")+(j+1)+" "+["Ear","Build","Song","Review"][j]+'</button>').join("")+'</div>'+
   '<div class="ss-hrow"><div><span class="label">Step '+(i+1)+' of 4</span><h2>'+esc(st.name)+'</h2></div>'+
   '<div class="ss-timer'+(S.paused?" dim":"")+'"><span id="stepT">'+fmt(S.left)+'</span> <small>'+(S.idle?"ready to start":S.paused?"paused":"this step")+'</small></div>'+
   '<div class="ss-total">Session left<br><b id="totT">'+fmt(totalLeft())+'</b></div></div>'+
   '<div class="row"><button class="'+(S.idle?"btn small":"chip")+'" data-act="spause" aria-pressed="'+(S.paused&&!S.idle)+'">'+(S.idle?"Start step":S.paused?"Resume timer":"Pause timer")+'</button><button class="chip" data-act="sbasics" aria-pressed="false">Basics</button></div>'+
   '<p class="ss-tup" id="tup"'+(S.left<=0?"":" hidden")+'>Time is up for this step. Press Next when you are ready.</p></div>';
}
function sessFooter(){
  return '<div class="ss-foot"><div class="row">'+'<button class="btn ghost small" data-act="splan">Back to today\'s plan</button>'+'<button class="btn ghost small" data-act="sskip">Skip this step</button></div><div class="ss-next"><button class="btn" data-act="snext">Next</button><span class="hint">Up next: '+esc(SESS[S.step].next)+'</span></div></div>';
}
function earStep(){
  const m=dmeta(D.mode||S.drill);
  return '<div class="card stack"><span class="label">Today\'s drill</span><h3>'+esc(m.name)+'</h3><p class="hint">'+esc(m.blurb)+' Aim for 80% or more. Finish a round, then press Next.</p></div>'+drillBody();
}
function formula(q){const iv=(q==="add9"?[0,4,7,14]:Q[q]).slice().sort((a,b)=>a-b);const gaps=[];for(let i=1;i<iv.length;i++)gaps.push(iv[i]-iv[i-1]);return"root, then "+gaps.map(g=>g+" half step"+(g===1?"":"s")).join(", then ");}
const ROLES={'':["root","3rd","5th"],'m':["root","3rd","5th"],'7':["root","3rd","5th","7th"],'maj7':["root","3rd","5th","7th"],'m7':["root","3rd","5th","7th"],'sus4':["root","4th","5th"],'add9':["root","3rd","5th","9th"],'6':["root","3rd","5th","6th"],'dim':["root","3rd","5th"]};
function buildStep(){
  const cs=S.chords,i=Math.min(S.b.i,cs.length-1),c=parseChord(cs[i]),names=keyUsesFlats(c.root,minorish(c.q))?FLAT:SHARP;
  const rootName=names[c.root],sp=spellChord(rootName,c.q,c.root).map(x=>x.name);
  const v=voice(c.root,c.q,false,null),fing=fingersFor(v.notes),learn=S.b.show;
  const label=rootName+(c.q==="maj7"?"maj7":c.q),roles=ROLES[c.q]||[];
  const lastChord=i>=cs.length-1;
  const head='<div class="ss-titlebar"><span class="label">Chord '+(i+1)+' of '+cs.length+'</span><span class="pill">'+esc(formula(c.q))+'</span></div>';
  const nextBtn=lastChord?'':'<button class="btn" data-act="bnextch">Next chord</button>';
  const lastNote=lastChord?'<p class="hint">That was the last chord for today. Press Next below.</p>':'';
  if(!learn){
    const boxes=sp.map(()=>'<span class="note empty">?</span>').join("");
    return '<div class="card stack">'+head+'<h3 style="font-size:24px">Test yourself: <b>'+esc(label)+'</b></h3>'+
     '<p>Say the notes of '+esc(label)+' out loud, find them on your keyboard and play the chord. Then press <b>Show me</b> to check.</p>'+
     '<div class="notes" aria-label="Notes in the chord">'+boxes+'</div><div class="kbscroll" id="bkb">'+kbSvg([],null,[],{names:true})+'</div>'+
     '<div class="row"><button class="btn ghost" data-act="bshow">Show me</button><button class="btn ghost" data-act="bchord">Hear it</button>'+nextBtn+'</div>'+lastNote+'</div>';
  }
  const chips=sp.map((n,k)=>'<span class="nchip"><span class="note">'+esc(n)+'</span><small>'+esc(roles[k]||"")+'</small></span>').join("");
  const gaps=formula(c.q).replace(/^root, then /,"");
  const how='<p>To build <b>'+esc(label)+'</b>, start on <b>'+esc(rootName)+'</b>, the root note. Then count '+esc(gaps)+'. A half step is the very next key up, black or white.</p>';
  const bridge=(c.q===""||c.q==="m")?'<div class="fb ok"><b>Try it with your hands</b><p>'+(c.q===""?'Play this chord, then lower the middle note one key. It turns minor.':'Play this chord, then raise the middle note one key. It turns major.')+'</p><div class="row"><button class="btn ghost small" data-act="bturn">Hear the change</button></div></div>':'';
  return '<div class="card stack">'+head+'<h3 style="font-size:24px">Build <b>'+esc(label)+'</b></h3>'+
   '<div><span class="label">The notes</span><div class="notes nrow" aria-label="Notes in the chord">'+chips+'</div></div>'+
   how+'<p class="hint">'+esc(QDESC[c.q]||"")+'</p>'+
   '<div class="kbscroll" id="bkb">'+kbSvg(v.notes,48+c.root,fing,{names:true})+'</div>'+
   '<div class="legend"><span><i style="background:var(--rh)"></i>Right hand (finger numbers)</span><span><i style="background:var(--lh)"></i>Left hand, bass note</span></div>'+
   '<span class="label">Your turn</span><ol class="steps"><li>Press <b>Hear it</b> and listen to the chord.</li><li>Right hand: play '+sp.map((n,k)=>esc(n)+' (finger '+fing[k]+')').join(", ")+' together.</li><li>Left hand: play '+esc(rootName)+' with finger 5 as the bass note.</li><li>Hold it and say the notes out loud.</li></ol>'+
   '<div class="row"><button class="btn" data-act="bchord">Hear it</button><button class="btn ghost" data-act="bshow">Hide it and test me</button>'+nextBtn+'</div>'+bridge+lastNote+'</div>';
}
function songStep(){
  return '<p class="hint">Today\'s goal: '+(UI.stage===1?"learn the shapes and play along slowly.":UI.stage===2?"play it from the chord names, with the hands hidden.":"play it from memory, naming each chord by ear.")+' Log a clean day with the button at the bottom of the page when you have played it through twice without stopping.</p>'+songView(true);
}
function revStep(){
  const rv=S.revSong?byId(S.revSong):null;
  const tabs='<div class="stages" role="group" aria-label="Review part"><button class="chip" data-act="rsub" data-v="a" aria-pressed="'+(S.sub==="a")+'">A. From memory</button><button class="chip" data-act="rsub" data-v="b" aria-pressed="'+(S.sub==="b")+'">B. Ear to hands</button></div>';
  if(S.sub==="b")return tabs+'<div class="card stack"><h3>Find the loop</h3><p class="hint">Hear a four-chord loop. It starts on I. Work out the other three chords and find them on your keyboard.</p></div>'+drillBody();
  return tabs+'<p class="hint">'+(rv?"Replay "+esc(rv.title)+" from memory. Chord names are hidden.":"No song is ready for review yet, so replay today\'s song from memory. Chord names are hidden.")+'</p>'+songView(true);
}
function sessionView(){
  if(S.overlay)return basicsView(true);
  const i=S.step,body=i===0?earStep():i===1?buildStep():i===2?songStep():revStep();
  return sessHeader()+body+sessFooter();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const kbk=e.target.closest&&e.target.closest("rect[data-m]");if(kbk){auditionNote(+kbk.getAttribute("data-m"));return;}
  const t=e.target.closest("[data-act]");if(!t||t.disabled)return;const a=t.dataset.act;if(a==="shift"||a==="feel")return;
  const s=(UI.tab==="learn"&&UI.view==="song")?cur():null;
  switch(a){
    case"timer":toggleTimer();break;
    case"addmin":{const k=todayKey();P.days[k]=Math.max(0,(P.days[k]||0)+(+t.dataset.n)*60);persist();paintTimer();break;}
    case"tab":stopPlay();UI.tab=t.dataset.tab;render();break;
    case"level":UI.level=+t.dataset.n;render();break;
    case"unlock":P.unlock[t.dataset.n]=true;persist();render();break;
    case"open":{stopPlay();UI.songId=t.dataset.id;UI.view="song";UI.tab="learn";UI.stage=t.dataset.stage?+t.dataset.stage:1;UI.bar=0;UI.peek=false;UI.shift=0;UI.loop="all";const so=cur();UI.smooth=so.level>0;UI.feel=so.feel||"block";UI.melody=true;UI.mel=null;render();window.scrollTo({top:0});break;}
    case"home":stopPlay();UI.view="home";render();break;
    case"stage":UI.stage=+t.dataset.n;UI.peek=false;render();break;
    case"peek":UI.peek=!UI.peek;paintLive();break;
    case"play":if(A.playing)stopPlay();else startPlay();break;
    case"speed":UI.speed=+t.dataset.n;render();break;
    case"loop":UI.loop="all";render();break;
    case"loopbar":UI.loop=UI.loop==="bar"?"all":"bar";render();break;
    case"click":UI.click=!UI.click;render();break;
    case"melody":UI.melody=!UI.melody;render();break;
    case"smooth":UI.smooth=!UI.smooth;render();break;
    case"names":UI.names=!UI.names;render();break;
    case"orig":UI.shift=s.origShift;render();break;
    case"bar":UI.bar=+t.dataset.i;UI.mel=null;paintLive();if(!A.playing)auditionBar(UI.bar);break;
    case"clean":{const rec=P.songs[s.id]||(P.songs[s.id]={clean:[]});const k=todayKey();const i=rec.clean.indexOf(k);if(i>=0)rec.clean.splice(i,1);else rec.clean.push(k);persist();render();break;}
    case"sstart":sessionBegin(t.dataset.step!=null?+t.dataset.step:null,!!t.dataset.fresh);break;
    case"sgo":{const k=+t.dataset.step;if(k!==S.step)go(k,true);break;}
    case"snext":advance("done");break;
    case"sskip":advance("skip");break;
    case"splan":stopPlay();S.lefts[S.step]=S.left;saveSess();UI.mode="start";render();window.scrollTo({top:0});break;
    case"sback":if(S.step>0)go(S.step-1,true);break;
    case"spause":if(S.idle){S.idle=false;S.paused=false;}else S.paused=!S.paused;render();break;
    case"sbasics":stopPlay();S.overlay=true;BS.n=0;BS.heard="";render();window.scrollTo({top:0});break;
    case"bstart":stopPlay();BS.n=0;BS.heard="";if(UI.mode!=="session")UI.mode="basics";render();window.scrollTo({top:0});break;
    case"bskip":P.seen=true;persist();UI.mode="start";render();break;
    case"bclose":stopPlay();if(S.overlay&&UI.mode==="session"){S.overlay=false;}else{P.seen=true;persist();UI.mode="start";}render();window.scrollTo({top:0});break;
    case"btopic":BS.n=+t.dataset.n;BS.heard="";render();break;
    case"bnext":BS.n=Math.min(BASICS.length-1,BS.n+1);BS.heard="";render();window.scrollTo({top:0});break;
    case"bprev":BS.n=Math.max(0,BS.n-1);BS.heard="";render();window.scrollTo({top:0});break;
    case"bhear":{const h=BASICS[BS.n].hear[+t.dataset.i];h[1]();BS.heard="Playing: "+h[0];render();break;}
    case"bmm":BS.mm=t.dataset.v;seq([{m:t.dataset.v==="maj"?CMAJ:[60,63,67],t:0,d:2}]);BS.heard="Playing C "+(t.dataset.v==="maj"?"major":"minor");render();break;
    case"bshow":S.b.show=!S.b.show;render();break;
    case"bchord":{const c=parseChord(S.chords[Math.min(S.b.i,S.chords.length-1)]);const cx=audio();if(cx){stopPlay();playV(c.root,c.q,cx.currentTime+0.06,2);}break;}
    case"bnextch":S.b.i++;S.b.show=true;render();break;
    case"rsub":S.sub=t.dataset.v;stopPlay();if(S.sub==="b"){D.mode="find";D.active=false;D.summary=null;}else setSong(S.revSong||S.song,3);render();break;
    case"tostart":leaveSession();UI.mode="start";render();window.scrollTo({top:0});break;
    case"browse":leaveSession();UI.mode="browse";UI.tab="learn";UI.view="home";render();window.scrollTo({top:0});break;
    case"browsebk":leaveSession();UI.mode="browse";UI.tab="learn";UI.view="home";UI.bopen=true;render();setTimeout(()=>{const b=$("#backup");if(b)b.scrollIntoView();},50);break;
    case"bcopy":copyBackup();break;
    case"brestore":restoreBackup();break;
    case"dmode":stopPlay();D.mode=t.dataset.id;D.active=false;D.summary=null;render();break;
    case"ddiff":D.diff=t.dataset.d;render();break;
    case"dstart":drillStart();break;
    case"dhear":drillPlay();break;
    case"dcmp":{const q=t.dataset.q,both=q==="both";if(!both)CMP.q=q;else CMP.q="m";render();const cx=audio();if(cx){stopPlay();const tt=cx.currentTime+0.1;if(both){playV(0,"",tt,1.6);playV(0,"m",tt+2,1.8);}else playV(0,q,tt,2);}break;}
    case"dgo":ear().rung=1;persist();if(UI.mode==="session"){S.drill="set";D.mode="set";D.active=false;D.summary=null;}render();break;
    case"dref":{const cx=audio();if(cx){stopPlay();if(t.dataset.c){const c=parseChord(t.dataset.c);playV(c.root,c.q,cx.currentTime+0.06,1.8);}else if(D.q)playV(D.q.root,t.dataset.q,cx.currentTime+0.06,1.8);}break;}
    case"bturn":{const c=parseChord(S.chords[Math.min(S.b.i,S.chords.length-1)]),cx=audio();if(cx){stopPlay();const tt=cx.currentTime+0.1;playV(c.root,c.q,tt,1.6);playV(c.root,c.q===""?"m":"",tt+2,1.8);}break;}
    case"danswer":drillAnswer(+t.dataset.i);break;
    case"dpick":drillPick(+t.dataset.bar,+t.dataset.i);break;
    case"dcheck":drillCheck();break;
    case"dnext":drillNext();break;
    case"dquit":D.active=false;D.summary=null;if(A.ctx)newMaster();render();break;
  }
});
document.addEventListener("input",e=>{if(e.target.id==="bin"&&UI.armed){UI.armed=false;const b=$("#brbtn");if(b)b.textContent="Restore";const m=$("#bmsg");if(m)m.textContent="";}});
document.addEventListener("change",e=>{
  if(e.target.id==="shiftsel"){UI.shift=+e.target.value;render();}
  if(e.target.id==="feelsel"){UI.feel=e.target.value;render();}
});

/* ---------- boot ---------- */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}loadLocal();UI.mode=P.seen?"start":"welcome";renderTimer();paintStreak();render();initCloud();
</script>

</body>
